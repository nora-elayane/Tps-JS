<!-- 
 TP 1 : Analyse de Données Numériques
Créez un tableau prix : [45, 12, 100, 34, 8, 55].
Fonction 1 : Calculer le total avec .reduce() .
Fonction 2 : Filtrer les prix > 30 avec .filter() .
Fonction 3 : Appliquer une remise de 10% sur tous les prix avec .map() .
  -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let prix =  [45, 12, 100, 34, 8, 55] ; 
        let total = prix.reduce(function(a , b){return a+=b});
        console.log(total) ;
        let sup = prix.filter(a=> a > 30) ;
        console.log(sup) ; 
        let avecRemise = prix.map(x => x - (x * 0.1)) ;
        console.log(avecRemise) ; 
    </script>
</body>
</html>
